<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Spine 播放器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-weight: normal; }
  html, body { height: 100%; }
  body {
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #fff; color: #2b2b2b; font-size: 13px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 9px 14px; border-bottom: 1px solid #e3e3e3; background: #fafafa;
  }
  .bar .title { font-size: 13px; color: #333; max-width: 340px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar label { color: #777; }
  select, button {
    font-size: 12px; padding: 4px 9px; border: 1px solid #cfcfcf;
    border-radius: 4px; background: #fff; color: #333; font-family: inherit;
  }
  button { cursor: pointer; }
  button:hover { background: #eef4fa; border-color: #9db8cf; }
  .ver { color: #2b6cb0; font-size: 12px; }
  .hint { color: #999; font-size: 12px; }
  #stage { flex: 1; position: relative; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #msg {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #a06000;
    font-size: 14px; background: #fafafa; text-align: center; padding: 20px;
  }
  #msgStage { margin-bottom: 14px; }
  .pbar {
    width: 70%; max-width: 440px; height: 8px; background: #e6e6e6;
    border-radius: 4px; overflow: hidden;
  }
  .pbar > div {
    height: 100%; width: 0; background: #5b9bd5; transition: width .18s;
  }
  .pbar.indet > div {
    width: 34%; animation: indet 1.1s ease-in-out infinite alternate;
  }
  @keyframes indet {
    from { margin-left: 0; }
    to   { margin-left: 66%; }
  }
  #msgDetail { margin-top: 8px; color: #888; font-size: 12px; }
  #msgFiles {
    margin-top: 14px; width: 70%; max-width: 520px; max-height: 30vh;
    overflow: auto; font-size: 12px; color: #777; text-align: left;
  }
  #msgFiles .f {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 2px 0; border-bottom: 1px solid #eee;
  }
  #msgFiles .f.done { color: #4a7a4a; }
  #msgFiles .f .nm {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl;
  }
  #msgFiles .f .st { white-space: nowrap; font-variant-numeric: tabular-nums; }
  #err {
    position: absolute; inset: 0; display: none; align-items: center;
    justify-content: center; color: #b03030; font-size: 14px;
    background: #fdf3f3; text-align: center; padding: 24px; white-space: pre-wrap;
  }
  .checker {
    background-image:
      linear-gradient(45deg, #e8e8e8 25%, transparent 25%),
      linear-gradient(-45deg, #e8e8e8 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #e8e8e8 75%),
      linear-gradient(-45deg, transparent 75%, #e8e8e8 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
  }
</style>
</head>
<body>
<div class="bar">
  <span class="title" id="title">加载中 ...</span>
  <label>变体</label>
  <select id="variantSel" style="min-width:100px;"></select>
  <label>皮肤</label>
  <select id="skin" style="min-width:120px;"></select>
  <span id="variantWrap" style="display:none;">
    <label>表情</label>
    <select id="variant" style="min-width:90px;"></select>
  </span>
  <label>动画</label>
  <select id="anim" style="min-width:180px;"></select>
  <button id="btnPause">暂停</button>
  <button id="btnReset">重置姿势</button>
  <button id="btnFit">适应窗口</button>
  <label>背景</label>
  <select id="bg">
    <option value="white">白色</option>
    <option value="checker">棋盘格</option>
    <option value="dark">深色</option>
  </select>
  <span class="ver" id="ver"></span>
  <span class="hint">滚轮缩放 · 拖拽平移 · 双击适应</span>
</div>
<div id="stage">
  <canvas id="canvas"></canvas>
  <div id="msg">
    <div id="msgStage">正在下载并解析 Spine 资源 ...</div>
    <div class="pbar" id="pbar"><div id="pbarFill"></div></div>
    <div id="msgDetail"></div>
    <div id="msgFiles"></div>
  </div>
  <div id="err"></div>
</div>

<script src="/vendor/spine-webgl-4.0.31.js"></script>
<script>
const $ = id => document.getElementById(id);

function fail(msg) {
  $("msg").style.display = "none";
  const e = $("err");
  e.style.display = "flex";
  e.textContent = msg;
}

// Spine 4.0 二进制: int32 lowHash + int32 highHash + 字符串(版本号)
// 字符串编码: varint 计数，0=null、1=空串，否则实际字节数 = 计数 - 1
function readSkelVersion(bytes) {
  try {
    let p = 8, count = 0, shift = 0, b;
    do { b = bytes[p++]; count |= (b & 0x7f) << shift; shift += 7; } while (b & 0x80);
    if (count <= 1) return "";
    return new TextDecoder("utf-8").decode(bytes.subarray(p, p + count - 1));
  } catch (_) { return ""; }
}

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("贴图加载失败: " + url));
    img.src = url;
  });
}

// ---------------- 下载进度 ----------------
const sleep = ms => new Promise(r => setTimeout(r, ms));

function fmtBytes(n) {
  if (!n) return "0 B";
  const u = ["B", "KB", "MB", "GB"];
  let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return (i > 0 && v < 10 ? v.toFixed(1) : Math.round(v)) + " " + u[i];
}

// bundle 下载状态（后端轮询）；fileRows 是各资源文件流式下载进度
let bundleState = null;
let bundleStop = false;
const fileRows = new Map();

function addFileRow(label) {
  const row = {label, loaded: 0, total: 0, done: false, el: null, stEl: null};
  const el = document.createElement("div");
  el.className = "f";
  const nm = document.createElement("span");
  nm.className = "nm";
  nm.textContent = label;
  const st = document.createElement("span");
  st.className = "st";
  st.textContent = "等待";
  el.appendChild(nm); el.appendChild(st);
  $("msgFiles").appendChild(el);
  row.el = el; row.stEl = st;
  fileRows.set(label, row);
  return row;
}

function render() {
  const pbar = $("pbar"), fill = $("pbarFill");
  pbar.classList.remove("indet");

  // bundle 下载阶段优先显示 bundle 真实进度
  if (bundleState && bundleState.status === "downloading") {
    if (bundleState.total > 0) {
      const pct = Math.min(100, bundleState.loaded / bundleState.total * 100);
      fill.style.width = pct + "%";
      $("msgDetail").textContent =
        pct.toFixed(0) + "% · " + fmtBytes(bundleState.loaded) + " / " + fmtBytes(bundleState.total);
    } else {
      // 服务器没给 Content-Length：用不定进度条 + 已下载字节
      pbar.classList.add("indet");
      $("msgDetail").textContent = "已下载 " + fmtBytes(bundleState.loaded) + " ...";
    }
    return;
  }

  // 资源文件传输阶段：按字节聚合
  let loaded = 0, total = 0, active = 0;
  for (const f of fileRows.values()) {
    loaded += f.loaded; total += f.total;
    if (!f.done) active++;
  }
  if (active > 0 && total > 0) {
    fill.style.width = Math.min(100, loaded / total * 100) + "%";
    $("msgDetail").textContent = fmtBytes(loaded) + " / " + fmtBytes(total);
  }
}

function updateFileRow(row) {
  row.stEl.textContent = row.done
    ? "完成 " + fmtBytes(row.loaded)
    : (row.total > 0
        ? Math.round(row.loaded / row.total * 100) + "% · " + fmtBytes(row.loaded)
        : fmtBytes(row.loaded));
  row.el.classList.toggle("done", row.done);
  render();
}

// 流式下载单个资源，返回 Uint8Array，实时更新文件行进度
async function downloadOne(url, label) {
  const row = addFileRow(label);
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(label + " 下载失败（HTTP " + resp.status + "）");
  row.total = Number(resp.headers.get("Content-Length") || 0);
  updateFileRow(row);
  const reader = resp.body.getReader();
  const chunks = [];
  for (;;) {
    const {done, value} = await reader.read();
    if (done) break;
    chunks.push(value);
    row.loaded += value.length;
    updateFileRow(row);
  }
  let len = 0;
  for (const c of chunks) len += c.length;
  const buf = new Uint8Array(len);
  let off = 0;
  for (const c of chunks) { buf.set(c, off); off += c.length; }
  row.done = true;
  updateFileRow(row);
  return buf;
}

// 轮询后端 bundle 下载进度；done/error 后自动停止，否则靠 bundleStop 结束
async function pollBundle(hexname) {
  const url = "/api/bundle_progress?hex=" + encodeURIComponent(hexname);
  while (!bundleStop) {
    try {
      const p = await (await fetch(url)).json();
      bundleState = p;
      render();
      if (p.status === "done" || p.status === "error") return;
    } catch (_) { /* 忽略单次轮询失败 */ }
    await sleep(400);
  }
}

async function main() {
  const params = new URLSearchParams(location.search);
  const skelPath = params.get("path");
  if (!skelPath) return fail("缺少 path 参数");

  $("msgStage").textContent = "正在查询 Spine 部件 ...";
  const partsResp = await fetch("/api/spine_parts?path=" + encodeURIComponent(skelPath));
  if (!partsResp.ok) return fail("部件查询失败: " + (await partsResp.text()));
  const parts = await partsResp.json();
  if (!parts.atlas) return fail("该单元缺少 atlas 文本，无法渲染");
  if (!parts.textures.length) return fail("该单元缺少贴图，无法渲染");
  $("title").textContent = parts.name;

  // 变体切换下拉（同角色的 m0/m1/b/c/f 等），切换时带新 path 重载页面
  const vSel = $("variantSel");
  if (parts.siblings && parts.siblings.length > 1 && vSel.options.length === 0) {
    const VARIANT_NAME = {m0: "常服", m1: "战斗服"};
    for (const s of parts.siblings) {
      const o = document.createElement("option");
      o.value = s.path;
      o.textContent = s.variant.toUpperCase() +
        (VARIANT_NAME[s.variant] ? " " + VARIANT_NAME[s.variant] : "");
      if (s.variant === parts.variant) o.selected = true;
      vSel.appendChild(o);
    }
    vSel.onchange = () => {
      location.search = "?path=" + encodeURIComponent(vSel.value);
    };
  } else {
    vSel.style.display = "none";
    vSel.previousElementSibling.style.display = "none"; // 隐藏"变体"标签
  }

  // 与 skel/atlas/贴图下载同时启动 bundle 进度轮询（首次播放后端要从 CDN 下载整个 bundle）
  if (parts.bundle_hex) pollBundle(parts.bundle_hex);
  $("msgStage").textContent = "正在获取资源（首次播放需从 CDN 下载 bundle）...";

  let atlasText, skelBytes;
  try {
    [atlasText, skelBytes] = await Promise.all([
      downloadOne(parts.atlas.url, "atlas · " + parts.atlas.rel.split("/").pop())
        .then(b => new TextDecoder("utf-8").decode(b)),
      downloadOne(parts.skel.url, "skel · " + parts.skel.rel.split("/").pop()),
    ]);
  } finally {
    bundleStop = true;
  }

  const version = readSkelVersion(skelBytes);
  const major = version.split(".").slice(0, 2).join(".");
  $("ver").textContent = version ? ("Spine " + version) : "";
  if (version && major !== "4.0") {
    return fail("运行时仅内置 Spine 4.0，该资源版本为 " + version + "，暂不支持渲染。\n可下载 bundle 后用对应版本 Spine 编辑器/运行时查看。");
  }

  // 贴图：atlas 页名 -> HTMLImageElement（与 bundle 同包，通常已缓存，走文件级进度）
  $("msgStage").textContent = "正在下载贴图 ...";
  const imagesByBase = {};
  await Promise.all(parts.textures.map(async t => {
    const buf = await downloadOne(t.url, "贴图 · " + t.rel.split("/").pop());
    const img = await loadImage(URL.createObjectURL(new Blob([buf])));
    imagesByBase[t.rel.split("/").pop()] = img;
  }));

  $("msgStage").textContent = "正在解析 Spine 数据 ...";
  render();

  const canvas = $("canvas");
  const gl = canvas.getContext("webgl", {alpha: false, antialias: true, preserveDrawingBuffer: true});
  if (!gl) return fail("浏览器不支持 WebGL");

  const mgl = new spine.ManagedWebGLRenderingContext(gl);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);

  const atlas = new spine.TextureAtlas(atlasText);
  for (const page of atlas.pages) {
    const img = imagesByBase[page.name] || imagesByBase[Object.keys(imagesByBase)[0]];
    if (!img) return fail("atlas 引用的贴图缺失: " + page.name);
    page.setTexture(new spine.GLTexture(mgl, img, false));
  }

  const binary = new spine.SkeletonBinary(new spine.AtlasAttachmentLoader(atlas));
  binary.scale = 1;
  let skeletonData;
  try {
    skeletonData = binary.readSkeletonData(skelBytes);
  } catch (e) {
    return fail("骨骼数据解析失败: " + e);
  }

  const skeleton = new spine.Skeleton(skeletonData);
  skeleton.setToSetupPose();
  const state = new spine.AnimationState(new spine.AnimationStateData(skeletonData));
  const animNames = skeletonData.animations.map(a => a.name);
  const animSel = $("anim");
  for (const n of animNames) {
    const o = document.createElement("option");
    o.value = n; o.textContent = n;
    animSel.appendChild(o);
  }

  // ---- 皮肤（Skin）----
  // 该游戏的角色 spine 用"基础皮肤 + 变体皮肤"组织：
  //   default 覆盖身体全部 slot（头发/衣服/身体/鼻子），
  //   face1/face2/... 只覆盖 face_eye、face_mouth 等几个脸部 slot。
  // 变体不能直接 setSkin 替换（否则身体消失），必须用 Skin.addSkin 叠加到基础皮肤上。
  const allSkins = skeletonData.skins;
  const skinSel = $("skin");
  const variantSel = $("variant");

  function skinSlotCount(skin) {
    return new Set(skin.getAttachments().map(e => e.slotIndex)).size;
  }

  let baseSkins = [];   // 完整皮肤（整体替换）
  let variantSkins = []; // 变体皮肤（叠加，如表情）
  if (allSkins.length) {
    // 覆盖 slot 最多的作为基础皮肤（通常是 default）
    const baseSkin = allSkins.reduce(
      (a, b) => skinSlotCount(b) > skinSlotCount(a) ? b : a, allSkins[0]);
    const baseCount = skinSlotCount(baseSkin);
    for (const s of allSkins) {
      if (s === baseSkin) continue;
      // 覆盖 slot 数明显更少（不超过基础的一半，且最多几个）→ 视为变体
      if (skinSlotCount(s) <= Math.max(3, Math.floor(baseCount * 0.5))) {
        variantSkins.push(s);
      }
    }
    baseSkins = [baseSkin, ...allSkins.filter(
      s => s !== baseSkin && !variantSkins.includes(s))];
  }

  for (const s of baseSkins) {
    const o = document.createElement("option");
    o.value = s.name;
    o.textContent = s.name === "default" ? "默认" : s.name;
    skinSel.appendChild(o);
  }
  if (variantSkins.length) {
    $("variantWrap").style.display = "";
    variantSel.appendChild(new Option("无", ""));
    for (const s of variantSkins) {
      variantSel.appendChild(new Option(s.name, s.name));
    }
    // 打开即带脸：默认选第一个表情
    variantSel.value = variantSkins[0].name;
  }

  function applySkin() {
    if (!allSkins.length) return;
    const base = allSkins.find(s => s.name === skinSel.value);
    // 组合一个临时皮肤：基础皮肤 + 选中的变体（表情）
    const combined = new spine.Skin("__preview_combined__");
    if (base) combined.addSkin(base);
    if (variantSel.value) {
      const v = allSkins.find(s => s.name === variantSel.value);
      if (v) combined.addSkin(v);
    }
    skeleton.setSkin(combined);
    // 切 skin 后必须重置姿势并重新 apply，否则附件不会刷新
    skeleton.setSlotsToSetupPose();
    state.apply(skeleton);
    skeleton.updateWorldTransform();
    bounds = computeBounds();
    fitView();
  }

  const batcher = new spine.PolygonBatcher(mgl, false);
  const renderer = new spine.SkeletonRenderer(mgl, false);
  const shader = spine.Shader.newColoredTextured(mgl);
  const camera = new spine.OrthoCamera(canvas.clientWidth, canvas.clientHeight);

  // ---- 视口/缩放 ----
  let userZoom = null, userX = null, userY = null;
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    camera.setViewport(w, h);
  }
  function computeBounds() {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    const scratch = new Float32Array(2048);
    for (const slot of skeleton.drawOrder) {
      if (!slot.bone.active) continue;
      const att = slot.getAttachment();
      if (!att || !(att instanceof spine.RegionAttachment || att instanceof spine.MeshAttachment)) continue;
      const n = att.worldVerticesLength;
      const buf = n * 2 <= scratch.length ? scratch : new Float32Array(n * 2);
      // RegionAttachment 在 4.0 是 4 参数版本(bone, worldVertices, offset, stride)
      // MeshAttachment 是 6 参数版本(slot, start, count, worldVertices, offset, stride)
      if (att instanceof spine.RegionAttachment) {
        att.computeWorldVertices(slot.bone, buf, 0, 2);
      } else {
        att.computeWorldVertices(slot, 0, n, buf, 0, 2);
      }
      for (let i = 0; i < n; i += 2) {
        const x = buf[i], y = buf[i + 1];
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
    if (!isFinite(minX)) {
      // 回退到导出尺寸
      minX = skeletonData.x || 0; minY = skeletonData.y || 0;
      maxX = minX + (skeletonData.width || 100); maxY = minY + (skeletonData.height || 100);
    }
    return {minX, minY, maxX, maxY,
            w: Math.max(1, maxX - minX), h: Math.max(1, maxY - minY),
            cx: (minX + maxX) / 2, cy: (minY + maxY) / 2};
  }
  let bounds;
  function fitView() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    camera.zoom = Math.max(bounds.w / (w * 0.86), bounds.h / (h * 0.86));
    camera.position.x = bounds.cx;
    camera.position.y = bounds.cy;
    userZoom = userX = userY = null;
  }
  function setAnim(name) {
    state.clearTracks();
    state.setAnimation(0, name, true);
    state.apply(skeleton);
    skeleton.updateWorldTransform();
    bounds = computeBounds();
    fitView();
  }

  // ---- 背景 ----
  function applyBg() {
    const v = $("bg").value;
    canvas.style.background = v === "dark" ? "#2b2b2b" : "";
    canvas.classList.toggle("checker", v === "checker");
    gl.clearColor(v === "dark" ? 0.17 : 1, v === "dark" ? 0.17 : 1, v === "dark" ? 0.17 : 1, 1);
  }

  // ---- 交互 ----
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    const base = userZoom != null ? userZoom : camera.zoom;
    const z = Math.min(20, Math.max(0.005, base * (e.deltaY > 0 ? 1.12 : 0.89)));
    camera.zoom = z; userZoom = z;
  }, {passive: false});
  let dragging = false, lastX = 0, lastY = 0;
  canvas.addEventListener("mousedown", e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
  window.addEventListener("mouseup", () => dragging = false);
  window.addEventListener("mousemove", e => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    camera.position.x -= dx * camera.zoom;
    camera.position.y += dy * camera.zoom;
    userX = camera.position.x; userY = camera.position.y;
  });
  canvas.addEventListener("dblclick", () => fitView());

  animSel.addEventListener("change", () => setAnim(animSel.value));
  skinSel.addEventListener("change", applySkin);
  variantSel.addEventListener("change", applySkin);
  $("btnPause").onclick = function () {
    paused = !paused;
    this.textContent = paused ? "继续" : "暂停";
  };
  let paused = false;
  $("btnReset").onclick = () => {
    skeleton.setToSetupPose();
    state.clearTracks();
    state.setAnimation(0, animSel.value, true);
    fitView();
  };
  $("btnFit").onclick = () => fitView();
  $("bg").onchange = applyBg;
  window.addEventListener("resize", resize);

  // ---- 主循环 ----
  resize();
  applyBg();
  // 应用默认皮肤组合（基础皮肤 + 第一个表情），打开角色即有人脸
  applySkin();
  setAnim(animNames.length ? animNames[0] : "");
  $("msg").style.display = "none";

  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    if (!paused) {
      state.update(dt);
      state.apply(skeleton);
      skeleton.updateWorldTransform();
    }
    camera.update();
    gl.clear(gl.COLOR_BUFFER_BIT);
    shader.bind();
    shader.setUniform4x4f(spine.Shader.MVP_MATRIX, camera.projectionView.values);
    batcher.begin(shader);
    renderer.premultipliedAlpha = false;
    renderer.draw(batcher, skeleton);
